[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adminkit-mcp"
version = "0.1.0"
description = "AdminKit public MCP server: network/mail/DNS check tools and an MCP endpoint security probe for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Netbase JSC" }]
keywords = ["mcp", "model-context-protocol", "security", "dns", "network"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://adminkit.net/developers/mcp/"
Repository = "https://github.com/netbasecorp/adminkit-mcp"
Changelog = "https://github.com/netbasecorp/adminkit-mcp/blob/main/CHANGELOG.md"

[project.scripts]
adminkit-mcp = "adminkit_mcp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adminkit_mcp"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]
